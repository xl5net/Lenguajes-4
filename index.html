<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajo practico N°1 - APIs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="contenedor-principal">
        
        <!-- Sección 1: Geolocalización -->
        <div id="Geolocalizacion" class="tarjeta">
            <h2>Tu Ubicación</h2>
            <p class="descripcion">Coordenadas obtenidas</p>
            
            <div id="coordenada_Latiud" class="grupo-input">
                 <label>Latitud</label>
                <input type="text" id="latitud" readonly value="Buscando...">
            </div> 

            <div id="coordenada_Longitud" class="grupo-input">
                <label>Longitud</label>
                <input type="text" id="longitud" readonly value="Buscando...">
            </div>
        </div>

        <div id="SubirImagen" class="tarjeta">
            <h2>Subir Imagen</h2>
            <p class="descripcion">Sube o arrastra una foto aquí.</p>
            
            <div id="imagenes" class="zona-arrastre">
                <span class="texto-principal">Arrastra tu imagen aquí o haz clic</span>
                
                <input type="file" id="inputImagen" accept="image/*">
            </div>
            <img id="VisualizarImagen">
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
